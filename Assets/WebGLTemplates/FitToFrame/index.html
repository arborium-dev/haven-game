<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <!--
      "FitToFrame": like Unity's Minimal template, but the game fills whatever space it's given
      (the itch.io embed, the browser window, or fullscreen) instead of drawing at a fixed pixel size.
      The game keeps itself 16:9 inside that space with black bars (see aspect_lock.cs).
    -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;   /* no scrollbars, and arrow keys / space don't scroll the page */
        background: #000;
      }
      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
        outline: none;
      }
      #loading-bar {
        position: fixed;
        left: 0;
        bottom: 0;
        height: 6px;
        width: 0%;
        background: #F9B21E;
        transition: width 0.1s;
      }
    </style>
#if SHOW_DIAGNOSTICS
    <link rel="stylesheet" href="<<<TemplateData/diagnostics.css>>>">
    <script src="<<<TemplateData/diagnostics.js>>>"></script>
#endif
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading-bar"></div>
#if SHOW_DIAGNOSTICS
    <div id="unity-footer">
        <img id="diagnostics-icon" src="TemplateData/webmemd-icon.png">
    </div>
#endif
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#loading-bar");

      // Clicking the game gives it the keyboard (needed inside the itch.io page).
      canvas.addEventListener("pointerdown", function () { canvas.focus(); window.focus(); });

#if SHOW_DIAGNOSTICS
      // position the diagnostics icon in the corner on the canvas
      var diagnosticsIcon = document.getElementById("diagnostics-icon");
      diagnosticsIcon.style.position = "fixed";
      diagnosticsIcon.style.bottom = "10px";
      diagnosticsIcon.style.right = "0px";
#endif

      createUnityInstance(canvas, {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // The game's render size follows the canvas's on-page size automatically (matchWebGLToCanvasSize).
      }, function (progress) {
        loadingBar.style.width = (100 * progress) + "%";
      }).then(function (unityInstance) {
        loadingBar.style.display = "none";
        canvas.focus();
#if SHOW_DIAGNOSTICS
        document.getElementById("diagnostics-icon").onclick = function () {
          unityDiagnostics.openDiagnosticsDiv(unityInstance.GetMetricsInfo);
        };
#endif
      }).catch(function (message) {
        alert(message);
      });
    </script>
  </body>
</html>
